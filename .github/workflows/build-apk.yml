name: Build Drishti AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allows manual trigger from GitHub website

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Setup Java 21 (required for Android Gradle Plugin)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install frontend dependencies
      - name: Install npm dependencies
        run: npm ci

      # 6. Build React frontend (Vite)
      - name: Build React frontend
        run: npm run build

      # 7. Install Capacitor CLI and sync Android
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 9. Build the debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 10. Upload APK as downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drishti-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 11. Show APK info
      - name: Show APK size
        run: |
          echo "✅ APK BUILD SUCCESSFUL!"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
